<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >

  <title>Jazmín · Mi Primera Comunión</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <main id="app">

    <!-- =========================================
         EXPERIENCIA AR
         ========================================= -->

    <div id="ar-container">

      <!-- BOTÓN PARA VOLTEAR LA ESTAMPITA -->
      <button id="flip-button" class="hidden">
        Voltear
      </button>

    </div>


    <!-- =========================================
         PANTALLA DE PRESENTACIÓN
         ========================================= -->

    <section id="start-screen" class="screen">

      <div class="presentation">

        <!-- IMAGEN COMPLETA DE LA PRESENTACIÓN -->
        <img
          src="./assets/presentacion-jazmin.png"
          alt="Jazmín · Mi Primera Comunión"
          class="presentation-image"
        >

        <!--
          BOTÓN REAL TRANSPARENTE.
          Está colocado encima del botón dibujado
          en la imagen.
        -->
        <button
          id="start-button"
          class="presentation-button"
          aria-label="Abrí mi estampita"
        >
          <span class="sr-only">
            Abrí mi estampita
          </span>
        </button>

      </div>

    </section>


    <!-- =========================================
         ESTADO DE LA CÁMARA
         ========================================= -->

    <div id="status" class="status hidden">
      Apuntá la cámara a la estampita
    </div>


    <!-- =========================================
         CERRAR CÁMARA
         ========================================= -->

    <button
      id="stop-button"
      class="stop hidden"
      aria-label="Cerrar cámara"
    >
      ×
    </button>

  </main>


  <!-- =========================================
       JAVASCRIPT AR
       ========================================= -->

  <script type="module" src="./app.js?v=8"></script>

</body>
</html>
